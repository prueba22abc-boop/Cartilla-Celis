<style>

.rv .ar{transform-origin:20px 17px;animation:sw .32s ease-in-out infinite alternate}.rv .lg{transform-origin:20px 30px;animation:sw .32s ease-in-out infinite alternate}.rv .a2,.rv .l1{animation-direction:alternate-reverse}@keyframes sw{from{transform:rotate(-35deg)}to{transform:rotate(35deg)}}
.fln{position:absolute;right:56px;top:22px;bottom:0;width:14px;background:repeating-conic-gradient(#fff 0 25%,#05491f 0 50%) 0 0/14px 14px}

<body>
<div id="wl"><div class="rays"></div><div class="in"><div class="fl" id="wf"></div><svg class="rg" id="wr" viewBox="0 0 120 56" aria-hidden="true"></svg><h1>Cartilla Olímpica</h1><p>Valores olímpicos y habilidades blandas en la práctica profesional del deporte</p><button class="go" id="gb" onclick="start()">Comenzar ▶</button></div></div>

<script>
const $=id=>document.getElementById(id);

const TO="SebasCelis21@gmail.com",AUTOR="Sebastián Celis";
const VID=["https://youtu.be/geYr0-Mlm-k","https://youtu.be/Yonlg4TcY0s"];

const IC=['<path d="M12 3c1 4-4 5-4 10a4 4 0 008 0c0-2-1-3-2-4 0 2-1 3-2 3 1-3 0-6 0-9z"/>','<circle cx="7" cy="9" r="3.5"/><circle cx="12" cy="9" r="3.5"/><circle cx="17" cy="9" r="3.5"/><circle cx="9.5" cy="14" r="3.5"/><circle cx="14.5" cy="14" r="3.5"/>','<circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 20c0-4 3-6 6-6s6 2 6 6M12 20c0-3 2-5 4-5s6 1 6 5"/>','<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>','<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM8 12h8M8 16h5"/>','<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/>','<circle cx="12" cy="14" r="7"/><path d="M12 14v-4M9 3h6M12 3v4"/>','<path d="M7 4h10v5a5 5 0 01-10 0zM7 6H4v1a3 3 0 003 3M17 6h3v1a3 3 0 01-3 3M12 14v4M8 21h8M10 18h4"/>'];

/* sonido */
let AC=null,mute=false;
function tone(f,t,d,ty,v){const c=AC,o=c.createOscillator(),g=c.createGain(),n=c.currentTime+t;o.type=ty||"sine";o.frequency.value=f;g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v||.15,n+.02);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+d+.05)}
function nz(t,d,v,f,q){const c=AC,n=c.currentTime+t,b=c.createBuffer(1,Math.ceil(c.sampleRate*d),c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const o=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();o.buffer=b;fl.type="bandpass";fl.frequency.value=f;fl.Q.value=q||1;g.gain.value=v;o.connect(fl);fl.connect(g);g.connect(c.destination);o.start(n)}
